# Tool configuration. Kept in one file so `make lint`, `make security` and a
# bare `pytest` cannot be configured differently from the CI job that calls them.

[tool.pytest.ini_options]
# Mirrors TEST_DIRS in the Makefile. Without this, a bare `pytest` collected a
# different set than CI did: edge/raspberry-pi/camera/test_prompt.py is a CLI
# script that happens to be named test_*.py and contains no test functions, and
# scripts/tests/ was not collected at all.
testpaths = [
    "tests",
    "scripts/tests",
]
# importlib import mode, so two directories may hold same-named modules without
# the "import file mismatch" error the default prepend mode raises. No such pair
# exists now — scripts/check_test_coverage_drift.py fails on a new one — but the
# mode is also what lets scripts/tests/ coexist with tests/ without __init__.py
# bookkeeping.
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120
# .aws-sam holds vendored build output, not source.
extend-exclude = [".aws-sam", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # function call in default argument: common and intentional here
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hardcoded fixture credentials and use assert by design.
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]
"scripts/tests/**" = ["S101", "S603", "S607"]

# Guard scripts shell out to git and to the pinned tools on purpose.
"scripts/check_*.py" = ["S603", "S607"]

[tool.bandit]
# Vendored build output and the virtualenv are not this repo's code.
#
# Test directories are excluded here and covered by ruff's flake8-bandit rules
# (`S` in [tool.ruff.lint]) plus gitleaks instead. Keeping them in bandit's scope
# produced 7 findings that were all fixture data — 'test-password' and /tmp paths
# in @patch.dict decorators. Left in place that noise is what makes a real
# finding easy to scroll past, so the split is deliberate rather than a waiver:
# nothing stops being scanned, it is scanned by the tool with the right
# per-file-ignores for test code.
exclude_dirs = [
    ".aws-sam",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "tests",
]
# B603/B607 fire on every `subprocess.run(["git", ...])` in the drift guards,
# which is how those guards ask git what is tracked: fixed argv, no shell, no
# interpolated input. A line-anchored `# nosec` was tried first and only took
# effect for B404 and B607 — B603 is reported against a different line than the
# comment sat on, which is precisely the way a suppression silently stops
# applying. Skipping the two IDs here is stable, and it does not create a blind
# spot: ruff's equivalents (S602/S603/S607) stay enabled everywhere except
# scripts/check_*.py, per [tool.ruff.lint.per-file-ignores] above.
skips = ["B603", "B607"]
