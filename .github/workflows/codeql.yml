name: CodeQL

# Why this exists alongside `make bandit`
# --------------------------------------
# bandit matches patterns in a single file: a `subprocess` call with a shell string,
# an `assert` in shipped code, an unpinned `urlopen`. CodeQL follows data across
# functions and modules, which is the shape of the defect that matters most here —
# a publisher-controlled device ID or MQTT topic level reaching a path, an S3 key or
# a SQL statement (see cloud/iot_ingestion/identifiers.py). Neither tool subsumes
# the other, and both stay.
#
# It is also the tool OpenSSF Scorecard's SAST check recognises. bandit runs on
# every commit here and counts for nothing there, which is why that check read 3/10
# with 11 of 30 commits "checked with a SAST tool". Adding this does not backfill
# those commits: the number climbs as new ones land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds old code. Offset from the
    # Scorecard and zizmor schedules to keep the Monday runs from colliding.
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writing the SARIF into the Security tab. Job-level, not top-level: a job
      # added to this file later should not inherit it.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The codeql-action pins below are v4. v3 still works today, and the first run
      # of this workflow warned that the v3 line is announced for deprecation in
      # December 2026 — worth taking before it becomes a broken pin rather than a
      # warning. scorecard.yml uses the same commit for upload-sarif.

      # Must match the Runtime: in the Lambda templates, for the same reason the
      # test job pins it: analysing the code on an interpreter that never runs it
      # can resolve imports differently. scripts/check_dependency_pins.py fails if
      # these diverge.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          # build-mode is not set: Python needs no build. Dependencies are
          # deliberately not installed either — CodeQL analyses this repository's
          # code, and a missing third-party stub costs recall on calls into that
          # library, not on the paths through code committed here.
          config-file: .github/codeql-config.yml

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:python"
