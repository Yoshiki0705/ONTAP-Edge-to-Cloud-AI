name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

# Every job below invokes a Makefile target rather than a tool.
#
# The previous version ran `pytest tests/ -v` plus `pytest usecases/<matrix>/tests/`
# with the use cases named literally, and installed cfn-lint and pytest with a bare
# `pip install`. Three consequences, all silent:
#
#   - a new usecases/<name>/tests/ was never run, because the matrix did not name it;
#   - scripts/tests/ was in no inventory at all, so the gate self-tests ran nowhere;
#   - CI resolved cfn-lint to the newest release while .venv held an older one, so
#     local and CI could disagree about whether a template was valid.
#
# TEST_DIRS, PY_DIRS and CFN_TEMPLATES in the Makefile are now the only path lists,
# and scripts/check_test_coverage_drift.py fails if a workflow stops using them.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Must match the Runtime: in the Lambda templates.
          # scripts/check_dependency_pins.py fails if they diverge.
          python-version: "3.12"
      - name: Create virtualenv the Makefile expects
        run: python -m venv .venv
      - name: Install pinned tooling
        run: make dev-install
      - name: Install runtime dependencies for import-time collection
        # conftest.py mocks cv2 and confluent_kafka; the rest must be importable.
        run: .venv/bin/pip install requests opencv-python-headless numpy boto3
      - name: Report tool versions actually in use
        run: make tool-versions
      - name: Run every test directory in TEST_DIRS
        run: make test-verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Create virtualenv the Makefile expects
        run: python -m venv .venv
      - name: Install pinned tooling
        run: make dev-install
      - name: ruff over PY_DIRS
        run: make lint-py
      - name: cfn-lint over CFN_TEMPLATES
        run: make lint-cfn
      - name: bandit over PY_DIRS
        run: make bandit

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The guards ask git which files are tracked.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Create virtualenv the Makefile expects
        run: python -m venv .venv
      - name: Install pinned tooling
        run: make dev-install
      - name: Guards that detect a silently-disabled gate
        # check_git_hooks_wiring.py is deliberately absent: core.hooksPath is a
        # developer's local setting and a runner has no hooks to wire. It runs
        # from `make drift` locally.
        run: |
          .venv/bin/python scripts/check_agent_context_budget.py
          .venv/bin/python scripts/check_test_coverage_drift.py
          .venv/bin/python scripts/check_dependency_pins.py
          .venv/bin/python scripts/check_sql_interpolation.py

  pre-commit:
    # .pre-commit-config.yaml configured six hooks that executed nowhere: the CLI
    # was not installed locally, no hook was installed into .git/hooks, and no
    # workflow ran it. This job is what makes them real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
