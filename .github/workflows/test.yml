name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        usecase: [3d-print-quality, ontap-telemetry-analytics]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest requests opencv-python-headless numpy boto3

      - name: Run shared tests
        run: pytest tests/ -v

      - name: Run use-case tests (${{ matrix.usecase }})
        run: pytest usecases/${{ matrix.usecase }}/tests/ -v
        if: hashFiles(format('usecases/{0}/tests/*.py', matrix.usecase)) != ''

  lint-cfn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint shared infra
        run: cfn-lint cloud/**/*.yaml

      - name: Lint use-case templates
        run: cfn-lint usecases/*/template.yaml
