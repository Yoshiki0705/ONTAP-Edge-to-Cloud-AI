AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Visual Inspection (Manufacturing) - Reuses 3d-print-quality Lambda
  with a different prompt. Demonstrates code reusability.

Parameters:
  SharedStackName:
    Type: String
    Default: edge-to-cloud-ai-poc

  BedrockScreeningModel:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0

  BedrockDetailModel:
    Type: String
    Default: jp.anthropic.claude-sonnet-4-5-20250929-v1:0

Resources:
  InspectionAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "edge-to-cloud-visual-inspection-${AWS::StackName}"
      Runtime: python3.12
      Handler: handler.handler
      Role: !ImportValue
        Fn::Sub: "${SharedStackName}-ImageAnalyzerRoleArn"
      Timeout: 90
      MemorySize: 256
      Environment:
        Variables:
          RESULT_BUCKET: !ImportValue
            Fn::Sub: "${SharedStackName}-BucketName"
          ALERT_TOPIC_ARN: !ImportValue
            Fn::Sub: "${SharedStackName}-AlertTopicArn"
          SCREENING_MODEL_ID: !Ref BedrockScreeningModel
          DETAIL_MODEL_ID: !Ref BedrockDetailModel
          CONFIDENCE_THRESHOLD: "0.7"
          TWO_STAGE_ENABLED: "true"
          # This is what makes the use case a variant rather than a copy: the same
          # handler, told to inspect something else. Without these two the stack
          # deploys cleanly and then looks for stringing and spaghetti on a metal
          # part, because the handler defaults to the 3D print prompts.
          SCREENING_PROMPT: >-
            Analyze this product image quickly. Is there any visible defect?
            Reply JSON only: {"has_defect": true|false, "confidence": 0.0-1.0,
            "defect_hint": "brief description or empty"}
          DETAIL_PROMPT: |
            You are a manufacturing quality inspector. Analyze this image of a finished product.

            Check for the following defects:
            1. **Scratches** - surface scratches or abrasions
            2. **Discoloration** - colour variations, stains, oxidation
            3. **Burrs** - excess material on edges
            4. **Dimensional anomaly** - visible warping or deformation
            5. **Surface roughness** - uneven surface finish
            6. **Contamination** - foreign particles or debris

            Respond in JSON format:
            {
              "status": "normal" | "anomaly_detected",
              "confidence": 0.0-1.0,
              "anomalies": [
                {
                  "type": "scratch|discoloration|burr|dimensional|roughness|contamination",
                  "severity": "low|medium|high|critical",
                  "location": "description of where in the image",
                  "description": "brief description of the issue"
                }
              ],
              "recommendation": "action to take",
              "overall_quality_score": 0-100
            }

            If the product looks acceptable with no defects, return status "normal" with an
            empty anomalies array and quality score above 80.
            Be conservative - only flag clear defects, not minor cosmetic variations.
      Code:
        ZipFile: |
          # Deploy actual code: aws lambda update-function-code
          def handler(event, context):
              return {"statusCode": 501, "body": "Deploy code"}
      Tags:
        - Key: Project
          Value: edge-to-cloud-ai
        - Key: UseCase
          Value: visual-inspection

  DefectRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-high-defect-rate"
      AlarmDescription: "Defect rate > 5% - quality issue on production line"
      Namespace: EdgeToCloud/VisualInspection
      MetricName: DefectRate
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue
          Fn::Sub: "${SharedStackName}-AlertTopicArn"

  DefectAnalysisQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: edge_to_cloud_ai
      Name: visual-inspection-defect-summary
      Description: "Defect type distribution and trend"
      QueryString: |
        SELECT
          date_format(from_iso8601_timestamp(timestamp), '%Y-%m-%d') AS date,
          json_extract_scalar(payload, '$.result.defects[0].type') AS defect_type,
          count(*) AS count
        FROM processed_image_analysis
        WHERE json_extract_scalar(payload, '$.result.status') = 'fail'
        GROUP BY 1, 2
        ORDER BY 1 DESC, 3 DESC
        LIMIT 100
